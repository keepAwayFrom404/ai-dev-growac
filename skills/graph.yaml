# Skill Graph — 唯一权威数据源
# Domain 仅负责分类，不维护 mastery 或 evidence。
# Skill 通过 parent_id 形成任意深度层级；parent_id: null 表示 Domain 下的根 Skill。
# mastery.level: null(Unknown) | L0 | L1 | L2 | L3
# mastery.source: null | evidence | derived
#   - Unknown: level/source/confidence 必须全部为 null
#   - evidence: 当前 level 由该 Skill 的直接证据支持，evidence 至少包含一项
#   - derived: 当前 level 由子 Skill 推导；V0 仅保留模型，不实现计算或写入
# evidence: 引用 experiences/ 下的 Evidence 文件；父 Skill 也可以拥有直接 Evidence
